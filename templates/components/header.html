<!-- Header -->
<header class="site-header">
    <nav class="navbar">

        <a href="/" class="logo">
            <i data-lucide="graduation-cap"></i>
            <span>Tutor<strong>Link</strong></span>
        </a>

        <div class="nav-links">
            <a href="/" class="{% if active_page == 'home' %}active{% endif %}">
                首頁
            </a>

            <a href="/teachers.html" class="{% if active_page == 'teachers' %}active{% endif %}">
                尋找家教
            </a>

            <a
                href="/become-teacher.html"
                id="nav-teacher-link"
                class="{% if active_page == 'become-teacher' %}active{% endif %}"
            >
                成為家教
            </a>

            <a href="/#about">關於我們</a>
        </div>

        <div class="nav-actions">

            <!-- 會員登入後顯示的私訊入口 -->
            <a
                href="/messages.html"
                class="icon-button header-message-link"
                id="header-message-link"
                aria-label="我的訊息"
                hidden
            >
                <i data-lucide="message-circle"></i>

                <!-- 未讀訊息數量，預設隱藏 -->
                <span
                    class="message-unread-badge"
                    id="message-unread-badge"
                    hidden
                ></span>
            </a>

            <!-- 會員登入與註冊按鈕 -->
            <button type="button" class="btn-login" data-auth-open="login">
                登入
            </button>

            <button type="button" class="btn-register" data-auth-open="register">
                註冊
            </button>

            <!-- 會員登入後顯示的選單 -->
            <div class="member-menu" id="member-menu" hidden>

                <!-- 會員名稱按鈕 -->
                <button
                    type="button"
                    class="member-trigger"
                    id="member-trigger"
                    aria-expanded="false"
                    aria-controls="member-dropdown"
                >
                    <!-- 會員頭貼：預設顯示會員圖示 -->
                    <span class="member-avatar" id="member-avatar">
                        <i data-lucide="circle-user-round"></i>
                    </span>

                    <span id="member-name">會員名稱</span>

                    <span
                        id="member-notification-dot"
                        class="member-notification-dot"
                        aria-label="有未讀通知"
                        hidden
                    ></span>

                    <i data-lucide="chevron-down"></i>
                </button>

                <!-- 會員下拉選單 -->
                <div class="member-dropdown" id="member-dropdown" hidden>

                    <!-- 個人資料 -->
                    <a href="/profile.html" class="member-profile">
                        <i data-lucide="user-round"></i>
                        個人資料
                    </a>

                    <!-- 我的收藏老師 -->
                    <a href="/my-favorites.html" class="member-favorites">
                        <i data-lucide="heart"></i>
                        我的收藏老師
                    </a>

                    <!-- 我的課程／個人行事曆 -->
                    <a href="/calendar.html" class="member-calendar">
                        <i data-lucide="calendar-days"></i>
                        <span>我的課程／個人行事曆</span>

                        <span
                            id="member-calendar-dot"
                            class="member-calendar-dot"
                            aria-label="有未讀課程提醒"
                            hidden
                        ></span>
                    </a>

                    <!-- 評價通知中心 -->
                    <a
                        href="/notifications.html"
                        class="member-review-notifications"
                    >
                        <i data-lucide="bell"></i>

                        <span>通知中心</span>

                        <span
                            id="member-review-notification-dot"
                            class="member-calendar-dot"
                            aria-label="有未讀評價通知"
                            hidden
                        ></span>
                    </a>

                    <!-- 登出帳號 -->
                    <button
                        type="button"
                        class="member-logout"
                        id="member-logout"
                    >
                        <i data-lucide="log-out"></i>
                        登出帳號
                    </button>

                    <!-- 刪除帳號 -->
                    <button
                        type="button"
                        class="member-delete"
                        id="member-delete"
                    >
                        <i data-lucide="trash-2"></i>
                        刪除帳號
                    </button>

                </div>

            </div>

        </div>

    </nav>
</header>
